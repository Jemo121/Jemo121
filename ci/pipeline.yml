stages:
  - lint
  - generate

markdown-lint:
  stage: lint
  image: davidanson/markdownlint-cli2:latest
  script:
    - markdownlint-cli2 "README.md"
  rules:
    - when: always

snake:
  stage: generate
  image:
    name: ghcr.io/platane/snk/svg-only:latest
    entrypoint: [""]
  script:
    - mkdir -p dist
    - '/svg-only --github_user_name Jemo121 --outputs "dist/snake-dark.svg#github-dark"'
    - 'git config user.email "ci@noreply.gitlab.com"'
    - 'git config user.name "CI"'
    - git add dist/snake-dark.svg
    - 'git diff --cached --quiet || git commit -m "chore: update contribution snake"'
    - 'git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

generate-svgs:
  stage: generate
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache git
    - 'git config user.email "ci@noreply.gitlab.com"'
    - 'git config user.name "CI"'
  script:
    - go run ./tools/gen-certs-svg.go
    - go run ./tools/gen-stack-brick-svg.go assets/stack-brick.svg
    - git add assets/certs-honeycomb.svg assets/stack-brick.svg
    - 'git diff --cached --quiet || git commit -m "chore: regenerate stack and certs SVGs"'
    - 'git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tools/*.go
        - assets/*.svg
