stages:
  - lint
  - generate

markdown-lint:
  stage: lint
  image: davidanson/markdownlint-cli2:latest
  script:
    - markdownlint-cli2 "README.md"
  rules:
    - when: always

generate-svgs:
  stage: generate
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache git
    - 'git config user.email "ci@noreply.gitlab.com"'
    - 'git config user.name "CI"'
  script:
    - go run ./tools/gen-certs-svg.go
    - go run ./tools/gen-stack-brick-svg.go assets/stack-brick.svg
    - git add assets/certs-honeycomb.svg assets/stack-brick.svg
    - 'git diff --cached --quiet || git commit -m "chore: regenerate stack and certs SVGs"'
    - 'git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tools/*.go
        - assets/*.svg
